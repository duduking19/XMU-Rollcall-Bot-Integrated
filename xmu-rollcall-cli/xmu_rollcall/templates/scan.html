<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769aa">
  <title>扫码签到 · XMU Integrated</title>
  <style nonce="{{ nonce }}">{{ scanner_css|safe }}</style>
</head>
<body>
  <div class="app">
    <header class="header"><h1>扫码签到 <span id="demoBadge" class="preview-badge" hidden>预览</span></h1><span id="countdown" class="timer" aria-label="链接剩余时间">--:--</span></header>
    <main>
      <section class="camera-card" aria-label="扫码取景器">
        <div id="viewfinder" class="viewfinder">
          <video id="video" autoplay playsinline muted aria-label="相机实时画面"></video>
          <canvas id="mockCanvas" hidden aria-label="模拟教室画面"></canvas>
          <div class="camera-top"><span id="cameraLabel">相机准备中</span><button id="torch" class="icon-button" hidden aria-label="打开补光灯" aria-pressed="false">☀</button></div>
          <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="crosshair"></span><span class="scan-line"></span></div>
          <div id="cameraPlaceholder" class="camera-placeholder"><span class="camera-symbol" aria-hidden="true">⌖</span><span id="cameraPrompt">正在启动相机</span><button id="startCamera" class="camera-start" hidden>开启相机</button></div>
          <div class="camera-caption"><span id="viewHint">对准二维码</span></div>
        </div>
        <div class="camera-controls">
          <div class="zoom-heading"><label for="zoom">变焦</label><output id="zoomValue" for="zoom">—</output></div>
          <div class="zoom-control"><button id="zoomOut" aria-label="缩小相机变焦" disabled>−</button><input id="zoom" type="range" min="1" max="1" step="0.1" value="1" disabled aria-describedby="zoomHint"><button id="zoomIn" aria-label="放大相机变焦" disabled>＋</button></div>
          <p id="zoomHint" class="control-hint" hidden></p>
          <div class="lens-row"><label for="lens">镜头</label><select id="lens" disabled><option>正在读取</option></select></div>
        </div>
      </section>
      <div class="alternatives"><button id="photoButton" class="alternative"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-7 5 8"/></svg>相册</button><button id="captureButton" class="alternative"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 9 3h6l1 2h4a1 1 0 0 1 1 1v13H3V6a1 1 0 0 1 1-1z"/><circle cx="12" cy="12" r="4"/></svg>拍照</button></div>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <input id="captureInput" type="file" accept="image/*" capture="environment" hidden>
      <div id="actions" class="actions" hidden><button id="retry" class="primary-button">重试</button></div>
      <details id="mockPanel" class="mock-panel" hidden><summary>预览选项</summary><div class="mock-controls"><label for="mockScenario">场景</label><select id="mockScenario"><option value="success">签到成功</option><option value="invalid">错误二维码</option><option value="offline">网络中断</option><option value="uncertain">结果待确认</option><option value="expired">链接过期</option><option value="nozoom">变焦不可用</option></select><button id="mockScan" class="primary-button">模拟扫码</button><button id="mockReset" class="reset-button">重置</button></div></details>
    </main>
    <section id="statusCard" class="status-card" data-state="waiting" aria-live="polite" aria-atomic="true"><span id="statusIcon" class="status-icon" aria-hidden="true">⌁</span><div><h2 id="statusTitle">等待识别二维码</h2><p id="statusDetail" hidden></p></div></section>
  </div>
  <script id="decoder" nonce="{{ nonce }}">{{ decoder_js|safe }}</script>
  <script id="workerSource" type="text/plain">{{ worker_js|safe }}</script>
  <script id="boot" type="application/json">{{ boot|tojson }}</script>
  <script nonce="{{ nonce }}">{{ scanner_js|safe }}</script>
</body>
</html>
